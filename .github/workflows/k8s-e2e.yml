# Kind + `make local` + Hurl E2E (same path as developer machines).
# Uses a disposable PostgreSQL instance inside the Kind cluster.

name: K8s E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "treadstone/**"
      - "deploy/**"
      - "scripts/**"
      - "tests/e2e/**"
      - "web/**"
      - "alembic/**"
      - "Makefile"
      - "Dockerfile"
      - "web/Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/k8s-e2e.yml"
  workflow_dispatch:
    inputs:
      file:
        description: "Optional single Hurl file (e.g. 01-auth-flow.hurl)"
        required: false
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

concurrency:
  group: k8s-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.24.0
  KUBECTL_VERSION: v1.31.0
  HELM_VERSION: v3.16.2
  HURL_VERSION: 5.0.1
  SANDBOX_RUNTIME_IMAGE: ghcr.io/earayu/treadstone-sandbox:v0.2.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  skip-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice::Skipped K8s E2E on fork PR (secrets not available)."

  k8s-e2e:
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Resolve checkout ref
        id: git_ref
        run: |
          case "${{ github.event_name }}" in
            workflow_run) echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT" ;;
            pull_request) echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.git_ref.outputs.ref }}

      - name: Install kubectl
        run: |
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install kind
        run: |
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install hurl
        run: |
          curl -fsSL -o /tmp/hurl.deb \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/hurl.deb
          hurl --version

      - name: Write .env.local
        run: |
          set -euo pipefail
          umask 077
          JWT="$(openssl rand -hex 32)"
          cat > .env.local <<EOF
          TREADSTONE_DATABASE_URL=postgresql+asyncpg://treadstone:treadstone@postgres.treadstone-db.svc.cluster.local:5432/treadstone
          TREADSTONE_APP_NAME=treadstone
          TREADSTONE_DEBUG=false
          TREADSTONE_APP_BASE_URL=http://app.localhost
          TREADSTONE_AUTH_TYPE=cookie
          TREADSTONE_JWT_SECRET=${JWT}
          TREADSTONE_CORS_ALLOWED_ORIGINS=["http://localhost:5173","http://app.localhost"]
          TREADSTONE_EMAIL_BACKEND=memory
          TREADSTONE_METERING_ENFORCEMENT_ENABLED=true
          TREADSTONE_LEADER_ELECTION_ENABLED=true
          TREADSTONE_SANDBOX_DOMAIN=sandbox.localhost
          TREADSTONE_SANDBOX_NAMESPACE=treadstone-local
          TREADSTONE_SANDBOX_STORAGE_CLASS=treadstone-workspace
          EOF
          sed -i 's/^[[:space:]]*//' .env.local

      # Build the sandbox image from the current branch/tag so rootfs/runtime
      # contract changes are exercised in the same PR and through the same
      # Kind path as `make local`.
      - name: Sandbox runtime image override (GitHub-hosted runners)
        run: |
          cat > /tmp/ci-sandbox-runtime-image.yaml <<'EOF'
          image: treadstone-sandbox:e2e
          EOF

      - name: Build sandbox runtime image
        run: |
          docker build \
            -f deploy/sandbox-image/Dockerfile \
            -t treadstone-sandbox:e2e \
            --build-arg TREADSTONE_SANDBOX_VERSION="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            deploy/sandbox-image

      - name: Check browser and shell image contract
        run: |
          set -euo pipefail
          docker run -d --name sandbox-smoke --security-opt no-new-privileges \
            --shm-size=512m treadstone-sandbox:e2e
          trap 'docker cp sandbox-smoke:/tmp/workspace-validation /tmp/workspace-validation || true; docker logs sandbox-smoke; docker exec sandbox-smoke sh -c "tail -n 60 /tmp/treadstone/log/*.log" || true; docker rm -f sandbox-smoke' EXIT
          docker cp scripts/test_sandbox_image.py sandbox-smoke:/tmp/test_sandbox_image.py
          docker cp scripts/sandbox_openapi_base.json sandbox-smoke:/tmp/sandbox_openapi_base.json
          docker exec sandbox-smoke python /tmp/test_sandbox_image.py
          docker restart sandbox-smoke
          docker exec sandbox-smoke python /tmp/test_sandbox_image.py
          docker exec --user root sandbox-smoke pip install playwright==1.55.0
          docker cp scripts/test_sandbox_workspace.py sandbox-smoke:/tmp/test_sandbox_workspace.py
          docker exec sandbox-smoke python /tmp/test_sandbox_workspace.py

      - name: Upload sandbox workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-workspace
          path: /tmp/workspace-validation/
          if-no-files-found: ignore

      # Mirrors scripts/up.sh local + make deploy-all. deploy-infra waits for all
      # agent-sandbox CRDs to become Established before sandbox-runtime is installed.
      - name: Kind cluster, images, deploy
        env:
          RT_VALUES_EXTRA: /tmp/ci-sandbox-runtime-image.yaml
        run: |
          set -euo pipefail
          bash scripts/kind-setup.sh
          kubectl --context kind-treadstone apply -f deploy/kind/postgres.yaml
          kubectl --context kind-treadstone -n treadstone-db rollout status deployment/postgres --timeout=180s
          make image-api
          kind load docker-image treadstone:latest --name treadstone
          make image-web
          kind load docker-image treadstone-web:latest --name treadstone
          kind load docker-image treadstone-sandbox:e2e --name treadstone
          bash scripts/check-k8s-context.sh local
          make deploy-storage deploy-infra ENV=local
          make deploy-runtime deploy-api deploy-web ENV=local

      - name: make wait-k8s
        env:
          # Hurl E2E does not require a pre-warmed pool; skipping avoids a flaky 10-minute poll when
          # status.readyReplicas never reaches spec.replicas (e.g. image pull or probe variance on GH runners).
          SKIP_SANDBOX_WARM_POOL_WAIT: "1"
        run: make wait-k8s ENV=local

      - name: make smoke-web
        run: make smoke-web

      - name: make test-e2e
        env:
          # Controlled concurrency experiment: keep Hurl below full fan-out while
          # we measure whether sandbox creation stalls are caused by shared Kind /
          # runtime resource contention rather than strict test ordering.
          HURL_JOBS: "2"
          E2E_FILE: ${{ github.event.inputs.file || '' }}
        run: |
          if [ -n "${E2E_FILE:-}" ]; then
            make test-e2e FILE="${E2E_FILE}"
          else
            make test-e2e
          fi

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: reports/e2e/
          if-no-files-found: ignore

      - name: Decide if GitHub Pages site can be updated
        id: pages_meta
        if: always()
        run: |
          if [ -f reports/e2e/index.html ] && [ -d reports/e2e/store ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages (historical E2E batches)
        id: checkout_gh_pages
        if: always() && steps.pages_meta.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
        continue-on-error: true

      - name: Ensure site layout
        if: always() && steps.pages_meta.outputs.ready == 'true'
        run: |
          mkdir -p site/e2e/batches
          touch site/.nojekyll

      - name: Sync site with remote gh-pages tip
        if: always() && steps.pages_meta.outputs.ready == 'true' && steps.checkout_gh_pages.outcome == 'success'
        run: |
          git -C site fetch origin gh-pages
          git -C site reset --hard origin/gh-pages

      - name: Merge E2E batch into Pages site
        if: always() && steps.pages_meta.outputs.ready == 'true'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
        run: |
          python3 scripts/e2e_site.py merge \
            --incoming reports/e2e \
            --site-root site \
            --batch-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # peaceiris publishes publish_dir as the branch root; do not ship the checkout's .git tree.
      - name: Strip git metadata from publish directory
        if: always() && steps.pages_meta.outputs.ready == 'true'
        run: rm -rf site/.git

      - name: Deploy site to gh-pages branch
        if: always() && steps.pages_meta.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

      - name: E2E report GitHub Pages summary
        if: always() && steps.pages_meta.outputs.ready == 'true'
        run: |
          {
            echo "## E2E HTML reports (GitHub Pages)"
            echo ""
            echo "Dashboard (all batches): \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e/\`"
            echo ""
            echo "This run: \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/e2e/batches/${{ github.run_id }}-${{ github.run_attempt }}/\`"
            echo ""
            echo "Set **Settings → Pages → Build and deployment → Branch \`gh-pages\` / \`/\`** if you previously used \"GitHub Actions\" as the source."
            echo ""
            echo "Workflow run: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect diagnostics
        if: failure()
        env:
          APP_NS: treadstone-local
          AGENT_NS: agent-sandbox-system
          SANDBOX_SELECTOR: treadstone-ai.dev/workload=sandbox
        run: |
          set +e

          echo "=== cluster overview ==="
          kubectl get all -A || true
          echo

          echo "=== sandbox resources overview ==="
          kubectl get sandboxclaims,sandboxes,sandboxwarmpools,sandboxtemplates,pvc -A -o wide 2>/dev/null || true
          echo

          echo "=== recent events ==="
          kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -n 120 || true
          echo

          echo "=== agent-sandbox controller pods ==="
          kubectl -n "$AGENT_NS" get pods -o wide 2>/dev/null || true
          echo

          echo "=== agent-sandbox controller logs ==="
          kubectl -n "$AGENT_NS" logs deploy/agent-sandbox-controller --all-containers=true --tail=400 2>/dev/null || true
          echo

          echo "=== application namespace pods ==="
          kubectl -n "$APP_NS" get pods -o wide 2>/dev/null || true
          echo

          echo "=== sandbox CR yaml ==="
          kubectl -n "$APP_NS" get sandboxclaims,sandboxes -o yaml 2>/dev/null || true
          echo

          for resource in sandboxclaims sandboxes; do
            for obj in $(kubectl -n "$APP_NS" get "$resource" -o name 2>/dev/null || true); do
              echo "=== describe ${obj} ==="
              kubectl -n "$APP_NS" describe "$obj" || true
              echo
            done
          done

          sandbox_pods=$(kubectl -n "$APP_NS" get pods -l "$SANDBOX_SELECTOR" -o name 2>/dev/null || true)
          for pod in $sandbox_pods; do
            echo "=== describe ${pod} ==="
            kubectl -n "$APP_NS" describe "$pod" || true
            echo

            for container in $(kubectl -n "$APP_NS" get "$pod" -o jsonpath='{range .spec.initContainers[*]}{.name}{"\n"}{end}' 2>/dev/null || true); do
              echo "=== logs ${pod} init/${container} ==="
              kubectl -n "$APP_NS" logs "$pod" -c "$container" --tail=200 2>/dev/null || true
              echo
              echo "=== previous logs ${pod} init/${container} ==="
              kubectl -n "$APP_NS" logs "$pod" -c "$container" --previous --tail=200 2>/dev/null || true
              echo
            done

            for container in $(kubectl -n "$APP_NS" get "$pod" -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null || true); do
              echo "=== logs ${pod} ${container} ==="
              kubectl -n "$APP_NS" logs "$pod" -c "$container" --tail=200 2>/dev/null || true
              echo
              echo "=== previous logs ${pod} ${container} ==="
              kubectl -n "$APP_NS" logs "$pod" -c "$container" --previous --tail=200 2>/dev/null || true
              echo
            done
          done

      - name: Cleanup Kind cluster
        if: always()
        run: |
          make destroy-local || true
          rm -f .env.local
